[workspace]
resolver = "3"
members = ["xtask", "crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

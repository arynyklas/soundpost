#
# Runtime, browser, native-kernel, privacy and overhead qualification matrix (task 07.06).
#
# `tools/qualify --suite runtime|privacy|overhead --matrix qualification/matrix.yaml --report <dir>` runs every
# row of one suite against the builds actually installed on the host. A row is judged ONLY against the build
# it names: its probe checks the object header (ELF/PE machine), the version output and the platform, so a
# different version, kernel series, operating system or architecture can never stand in for it (an amd64 pass
# is never an arm64 row; Node success never qualifies Bun; Chrome 156 never qualifies Chrome 142).
# Each result carries exactly one of exercised, not_exercised, unsupported or denied.
#
# Build locations: the environment variable first, then PATH names, then repository-relative paths (also
# resolved against $SOUNDPOST_TOOLS_ROOT, the directory holding an unpacked `.tools`).
#
# Required rows are the claim: the command exits 0 only when every required row is exercised and within its
# design section 13 budget (qualification/workloads.yaml). Rows with `required: false` are real measurements
# of a different build/host (for example the Windows-hosted SDK runtimes, Chrome 156, the WSL2 kernel) that
# are recorded but never qualify a required row.
schema: soundpost-qualification-matrix/1
root: ..
workloads: qualification/workloads.yaml


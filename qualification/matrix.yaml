# Native kernel/architecture matrix: one REQUIRED row per series x architecture x capability. A row is exercised only by a genuine
# Linux runner of that exact series and architecture (WSL2 does not qualify; it is recorded as the wsl2-linux-kernel functional rows above).
native:
  - {suite: runtime, runner: native_capability, kernels: ["6.1", "6.6"], arches: [amd64, arm64], capabilities: [cpu, off_cpu, runqueue_split, frame_coverage, loss, memory, fds, privacy]}
  - {suite: runtime, runner: native_identity, kernels: ["6.1", "6.6"], arches: [amd64, arm64], capabilities: [identity_exit, identity_exec, pid_reuse, namespaces, no_frame_pointers]}
  - {suite: runtime, runner: native_gap, kernels: ["6.1", "6.6"], arches: [amd64, arm64], capabilities: [cpu_hotplug, container_modes]}
  - {suite: privacy, runner: privacy_native, kernels: ["6.1", "6.6"], arches: [amd64, arm64], capabilities: [canary_boundaries, stored_exported_records, no_stack_bytes_config, negative_control, scheduler_canaries]}
  - {suite: overhead, runner: overhead_native, kernels: ["6.1", "6.6"], arches: [amd64, arm64], capabilities: [cpu_loop, blocked_runqueue]}

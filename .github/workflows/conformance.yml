#
# Verification only: no publication, no registry push, no credentials. Toolchains come from
# build/toolchains.json and are checked against its sha256 pins before they run. Actions are
# pinned to full commit SHAs. The five local oracle images of source-lock.json are built by the
# "Build the locked oracle images" step from inputs pinned by digest and sha256 (never pulled by tag,
# never pushed); the harness runs one only after proving its files against the lock's content identity.
name: conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  query-language:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the pinned Go toolchain
        run: |
          set -eu
          version=$(jq -r .go.version build/toolchains.json)
          url=$(jq -r .go.linux_amd64.url build/toolchains.json)
          sum=$(jq -r .go.linux_amd64.sha256 build/toolchains.json)
          archive=".tools/go${version}.linux-amd64.tar.gz"
          mkdir -p .tools/linux
          curl --fail --location --silent --show-error --output "$archive" "$url"
          echo "${sum}  ${archive}" | sha256sum --check --strict -
          tar -C .tools/linux -xzf "$archive"
          echo "$PWD/.tools/linux/go/bin" >> "$GITHUB_PATH"

      - name: Cache Go modules and build outputs (test results are never reused, -count=1)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('build/toolchains.json') }}-${{ hashFiles('go.sum') }}-conformance-${{ github.sha }}
          restore-keys: |
            go-${{ hashFiles('build/toolchains.json') }}-${{ hashFiles('go.sum') }}-

      - name: Prove the inputs and the locked conformance inventory
        run: |
          set -eu
          go mod download
          go run ./build verify
          go run ./cmd/soundpost-querycheck inventory --check

      - name: Format and vet
        run: |
          set -eu
          unformatted=$(gofmt -l tools internal/conformance cmd/soundpost-querycheck)
          test -z "$unformatted" || { echo "gofmt needed:"; echo "$unformatted"; exit 1; }
          go vet ./tools/... ./internal/conformance/... ./cmd/soundpost-querycheck

      - name: Campaign tests (race)
        # The race detector needs cgo; release binaries stay CGO_ENABLED=0 (workflow env). Under -race on a
        # two-core hosted runner the persisted-path smoke tests alone take longer than go test's default
        # 10 minute limit (every run of this workflow up to 4bd8897 died there: "panic: test timed out
        # after 10m0s"), so the limit is explicit and below the job timeout.
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 100m ./tools/qualify/... ./internal/conformance/... ./cmd/soundpost-querycheck

      # The hosted runner does not hold the lab daemon's oracle images (their ids are layer-timestamp
      # specific), so they are built here with the Dockerfiles as locked: upstream release images by
      # linux/amd64 digest, the Go builder images by digest (source-lock.json reference_compiler),
      # source archives by ADD --checksum, the adapter from this tree. The campaign below refuses an
      # image whose platform, entrypoint or any behaviour-determining file differs from the lock.
      - name: Build the locked oracle images
        run: bash conformance/query/oracles/build-images.sh

      # Runs soundpost-querycheck release (every seed in the matrix, all profiles, all FeatureSets)
      # and smoke (single and distributed) and exits nonzero unless every required row is verified.
      # A runner without the oracle images cannot observe the oracles, and this step then fails (it is
      # never allowed to pass without them).
      - name: Query language campaign
        run: go run ./tools/qualify/cmd/query-campaign --matrix qualification/query-matrix.yaml --artifact-dir query-campaign

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: query-campaign
          path: query-campaign/
          if-no-files-found: error

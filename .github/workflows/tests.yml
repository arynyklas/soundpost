#
# The whole Go test tree, split into parallel shards so a run takes as long as its slowest shard, not the sum.
# Verification only: no publication, no credentials. The Go toolchain comes from build/toolchains.json and its
# archive is checked against the sha256 pin on every run, cached or not. Only the module and build caches are
# reused between runs; test results are never taken from a cache (-count=1), because many packages start real
# processes, ports and files that the Go test cache cannot see. Actions are pinned to full commit SHAs.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {name: storage, args: "-short ./internal/storage"}
          - {name: control, args: "./internal/control"}
          - {name: appcore, args: "./internal/appcore"}
          - {name: replication, args: "./internal/replica ./internal/retention ./internal/backup"}
          - {name: query, args: "./internal/query/... ./internal/conformance/... ./cmd/soundpost-querycheck"}
          - {name: tools, args: "./tools/..."}
          - {name: rest, args: "REST"}
    name: go (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Cache the pinned Go toolchain archive
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .tools/go*.linux-amd64.tar.gz
          key: go-archive-${{ hashFiles('build/toolchains.json') }}

      - name: Install the pinned Go toolchain (sha256 checked every run)
        run: |
          set -eu
          version=$(jq -r .go.version build/toolchains.json)
          archive=".tools/go${version}.linux-amd64.tar.gz"
          mkdir -p .tools/linux
          test -f "$archive" || curl --fail --location --silent --show-error --output "$archive" "$(jq -r .go.linux_amd64.url build/toolchains.json)"
          echo "$(jq -r .go.linux_amd64.sha256 build/toolchains.json)  ${archive}" | sha256sum --check --strict -
          tar -C .tools/linux -xzf "$archive"
          echo "$PWD/.tools/linux/go/bin" >> "$GITHUB_PATH"

      - name: Cache Go modules and build outputs
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('build/toolchains.json') }}-${{ hashFiles('go.sum') }}-${{ matrix.shard.name }}-${{ github.sha }}
          restore-keys: |
            go-${{ hashFiles('build/toolchains.json') }}-${{ hashFiles('go.sum') }}-${{ matrix.shard.name }}-
            go-${{ hashFiles('build/toolchains.json') }}-${{ hashFiles('go.sum') }}-

      - name: Install the pinned Node and generate the real source-map fixture (rest shard)
        if: matrix.shard.name == 'rest'
        run: |
          set -eu
          curl --fail --location --silent --show-error --output node.tar.gz "$(jq -r .node.linux_22.url build/toolchains.json)"
          echo "$(jq -r .node.linux_22.sha256 build/toolchains.json)  node.tar.gz" | sha256sum --check --strict -
          mkdir -p .tools/node && tar -C .tools/node --strip-components=1 -xzf node.tar.gz
          export PATH="$PWD/.tools/node/bin:$PATH"
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          node fixtures/artifacts/generate.mjs "$RUNNER_TEMP/smfix"
          echo "SOUNDPOST_SOURCEMAP_FIXTURE_DIR=$RUNNER_TEMP/smfix" >> "$GITHUB_ENV"

      - name: Test
        env:
          ARGS: ${{ matrix.shard.args }}
          # The real OCI symbolication tests need a private runtime config that CI does not hold; they require an explicit
          # choice and run on a host that has it (lane evidence), never silently here.
          SOUNDPOST_SYMBOLICATE_TEST_OCI: "skip:CI runners hold no private OCI runtime config"
        run: |
          set -eu
          go mod download
          if [ "$ARGS" = REST ]; then
            # Every package not covered by a named shard.
            ARGS=$(go list ./... | grep -v -E '^github.com/arynyklas/soundpost/(internal/(storage|control|appcore|replica|retention|backup|query|conformance)(/|$)|cmd/soundpost-querycheck$|tools/)' | tr '\n' ' ')
          fi
          SKIP=""
          # The real language campaign needs the locally pinned oracle images, which CI never pulls or builds; it is
          # owned by conformance.yml, where it runs and fails honestly until the gate is met. Everything else runs here.
          case "$ARGS" in *./tools/...*) SKIP='^TestCampaignReportsTheRealGateFaithfully$' ;; esac
          # shellcheck disable=SC2086
          go test -count=1 -p 2 -timeout 110m ${SKIP:+-skip "$SKIP"} $ARGS

  # The symbolicate tests that need a real sandbox are skipped everywhere above (no sandbox configuration). This job
  # runs the package against the native worker inside a hardened transient unit with a delegated cgroup subtree, as
  # production does (deploy/ci/symbolicate-native.sh), and fails if a required sandbox test was skipped.
  symbolicate-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: symbolicate (native sandbox)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Cache the pinned Go toolchain archive
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .tools/go*.linux-amd64.tar.gz
          key: go-archive-${{ hashFiles('build/toolchains.json') }}

      - name: Install the pinned Go toolchain (sha256 checked every run)
        run: |
          set -eu
          version=$(jq -r .go.version build/toolchains.json)
          archive=".tools/go${version}.linux-amd64.tar.gz"
          mkdir -p .tools/linux
          test -f "$archive" || curl --fail --location --silent --show-error --output "$archive" "$(jq -r .go.linux_amd64.url build/toolchains.json)"
          echo "$(jq -r .go.linux_amd64.sha256 build/toolchains.json)  ${archive}" | sha256sum --check --strict -
          tar -C .tools/linux -xzf "$archive"
          echo "$PWD/.tools/linux/go/bin" >> "$GITHUB_PATH"

      - name: Cache Go modules and build outputs
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('build/toolchains.json') }}-${{ hashFiles('go.sum') }}-symbolicate-${{ github.sha }}
          restore-keys: |
            go-${{ hashFiles('build/toolchains.json') }}-${{ hashFiles('go.sum') }}-symbolicate-
            go-${{ hashFiles('build/toolchains.json') }}-${{ hashFiles('go.sum') }}-

      - name: Native sandbox tests
        run: |
          set -eu
          go mod download
          bash deploy/ci/symbolicate-native.sh

#
# The two backing services of the reference estate, from images that are already local (nothing is
# pulled: `pull_policy: never`). The Python API, the Bun gateway, the jobs and the web build need
# the committed SDK source trees and the Soundpost node's per-source configuration, so the
# acceptance smoke (`go run ./tools/smoke journeys`) runs them as host processes; see README.md.
# Required environment: REFERENCE_PG_IMAGE (a local PostgreSQL 16 image id), REFERENCE_TLS_DIR
# (a directory holding leaf.pem and leaf.key for the dependency), REFERENCE_PG_PASSWORD.
name: soundpost-reference
services:
  postgres:
    image: ${REFERENCE_PG_IMAGE:?a local PostgreSQL 16 image id}
    pull_policy: never
    command: ["-c", "log_statement=all"]
    environment:
      POSTGRES_PASSWORD: ${REFERENCE_PG_PASSWORD:?random password}
      POSTGRES_DB: reference
    ports: ["127.0.0.1:${REFERENCE_PG_PORT:-0}:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    volumes:
      - ./api/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
  dependency:
    image: python:3.12-slim
    pull_policy: never
    command: ["python", "/app/server.py", "--listen", "0.0.0.0:8443", "--cert", "/tls/leaf.pem", "--key", "/tls/leaf.key"]
    ports: ["127.0.0.1:${REFERENCE_DEPENDENCY_PORT:-0}:8443"]
    volumes:
      - ./dependency/server.py:/app/server.py:ro
      - ${REFERENCE_TLS_DIR:?directory with leaf.pem and leaf.key}:/tls:ro
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

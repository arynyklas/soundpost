{{- /*
Per-member cluster configuration: the exact file `soundpost serve --mode distributed
--cluster-config` reads (appcore.NodeConfig). It holds paths and the membership, no key
material; certificates, keys, the CA and the seed are Secrets you create and reference by name
(values.yaml). The peer address of every member is its stable StatefulSet pod DNS name.
*/ -}}
{{- $root := . }}
{{- $name := default "soundpost" .Values.nameOverride }}
{{- range $m := .Values.members }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-{{ $m.name }}-config
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    soundpost.io/member: {{ $m.name }}
type: Opaque
stringData:
  node-{{ $m.id }}.json: |
    {
      "node_id": "{{ $m.id }}",
      "peer_listen": "0.0.0.0:{{ $root.Values.ports.peer }}",
      "certificate": "/etc/soundpost/pki/{{ $m.identity }}.crt",
      "private_key": "/etc/soundpost/pki/{{ $m.identity }}.key",
      "ca": "/etc/soundpost/ca/ca.crt",
      "seed": "/etc/soundpost/seed/cluster.seed",
      "initial_leader": "{{ $root.Values.initialLeader }}",
      "members": {
        "revision": "{{ $root.Values.membersRevision }}",
        "nodes": [
{{- range $i, $n := $root.Values.members }}
          {"id": "{{ $n.id }}", "address": "https://{{ $name }}-{{ $n.name }}-0.{{ $name }}-peer.{{ $root.Release.Namespace }}.svc:{{ $root.Values.ports.peer }}", "node_identity": "{{ $n.identity }}", "failure_domain": "{{ $n.failureDomain }}"}{{ if lt (add1 $i) (len $root.Values.members) }},{{ end }}
{{- end }}
        ]
      }
    }
{{- end }}

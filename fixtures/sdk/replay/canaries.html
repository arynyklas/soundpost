<script>
 const open = document.getElementById("open-host").attachShadow({mode: "open"});
 open.innerHTML = "<p>CANARY_OPEN_SHADOW_TEXT_BBBBBBBB</p><input value='CANARY_OPEN_SHADOW_INPUT'>";
 const closed = document.getElementById("closed-host").attachShadow({mode: "closed"});
 closed.innerHTML = "<p>CANARY_CLOSED_SHADOW_TEXT_CCCCCC</p>";
 const context = document.getElementById("canvas").getContext("2d");
 context.font = "14px sans-serif"; context.fillText("CANARY_CANVAS_PIXELS_DDDDDD", 4, 24);
 // Getter traps on the page's own nodes: any read by the recorder is recorded and fails the run.
 window.__traps = 0;
 for (const node of document.querySelectorAll("#trapped, #trapped span")) {
  for (const name of ["firstChild", "nextSibling", "parentNode", "childNodes", "localName", "tagName", "shadowRoot", "textContent", "innerHTML", "outerHTML", "attributes", "nodeType", "isContentEditable"]) {
   Object.defineProperty(node, name, {configurable: true, get() { window.__traps++; throw new Error("CANARY_TRAP_" + name); }});
  }
  Object.defineProperty(node, "getBoundingClientRect", {configurable: true, value() { window.__traps++; throw new Error("CANARY_TRAP_RECT"); }});
 }
 console.log("CANARY_CONSOLE_ARGUMENT_EEEEEEEE");
 document.addEventListener("copy", event => { event.clipboardData.setData("text/plain", "CANARY_CLIPBOARD_FFFFFFFFFF"); event.preventDefault(); });
</script>
<script type="module">
 import {createRecorder} from "/recorder.js";
 import {ReplayStream} from "/stream.js";
 window.__chunks = [];
 window.__stream = new ReplayStream(4096);
 window.__revoked = 0;
 window.__replay = createRecorder({
  projectPolicy: true, deploymentOptIn: window.__deployment !== false, root: document.documentElement,
  replayId: "a".repeat(32), sessionId: "b".repeat(32), capturePolicyRevision: "1", domain: {host: "host0001", boot: "boot0001", runtime: "runtime1"},
  clock: () => ({wall_ns: String(BigInt(Date.now()) * 1000000n), mono_ns: String(BigInt(Math.round(performance.now() * 1e6))), uncertainty_ns: "1000000"}),
  viewport: () => ({w: innerWidth, h: innerHeight, x: scrollX, y: scrollY}),
  onRevoked: () => { window.__revoked++; window.__stream.clear(); },
 }, chunk => { window.__chunks.push(JSON.stringify(chunk)); return window.__stream.push(chunk); });
 window.__ready = true;
</script>
